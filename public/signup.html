<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <script src="/auth_helper.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Karu AI - Sign Up</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --color-primary: #ef4444;
      --color-primary-hover: #dc2626;
      --color-bg: #f9fafb;
      --color-card-bg: #ffffff;
      --color-border: #e5e7eb;
      --color-text: #111827;
      --color-text-muted: #6b7280;
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: var(--font-family);
      background-color: #f3f4f6;
      color: var(--color-text);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .mobile-frame {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: #f9fafb;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      z-index: 10;
      box-sizing: border-box;
    }

    .auth-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #f3f4f6;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .brand-logo-custom {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      color: var(--color-primary);
    }

    .header-titles {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-titles h2 {
      font-size: 19px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }

    .header-titles p {
      font-size: 13px;
      color: var(--color-text-muted);
      line-height: 1.4;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      text-align: left;
    }

    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      letter-spacing: 0.2px;
    }

    .input-field {
      width: 100%;
      height: 44px;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 13.5px;
      color: #111827;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .input-field:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }

    .input-field::placeholder {
      color: #9ca3af;
    }

    .input-wrapper-pass {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-wrapper-pass .input-field {
      padding-right: 42px;
    }

    .btn-eye-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #4b5563; cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-eye-toggle:hover {
      color: var(--color-primary);
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
      margin-top: 4px;
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .divider-custom {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
    }

    .divider-custom::before, .divider-custom::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }

    .divider-custom:not(:empty)::before {
      margin-right: 12px;
    }

    .divider-custom:not(:empty)::after {
      margin-left: 12px;
    }

    .btn-google-custom {
      width: 100%;
      height: 44px;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      color: #111827;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-google-custom:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    .switch-page-text-custom {
      margin-top: 22px;
      font-size: 12.5px;
      color: var(--color-text-muted);
      text-align: center;
    }

    .switch-page-btn-custom {
      background: none;
      border: none;
      color: var(--color-primary);
      font-weight: 700;
      cursor: pointer;
      font-size: 12.5px;
      margin-left: 4px;
      transition: color 0.2s;
    }

    .switch-page-btn-custom:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div class="auth-card">
      <div class="brand-logo-custom">
        <a href="feed.html" class="brand-badge">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <span class="brand-title">Karu<span>AI</span></span>
        </a>
      </div>

      <div class="header-titles">
        <h2>Create Account</h2>
        <p>Join Karu AI and build viral carousels</p>
      </div>

      <form id="signup-element-form">

            <div class="input-group">
              <label class="input-label" for="signup-username">Full Name</label>
              <input type="text" id="signup-username" class="input-field" placeholder="Roi Chocron" required autocomplete="name">
            </div>
            <div class="input-group">
              <label class="input-label" for="signup-email">Email Address</label>
              <input type="email" id="signup-email" class="input-field" placeholder="name@example.com" required autocomplete="email">
            </div>
            <div class="input-group">
              <label class="input-label" for="signup-password">Password</label>
              <div class="input-wrapper-pass">
                <input type="password" id="signup-password" class="input-field" placeholder="At least 8 characters" required autocomplete="new-password">
                <button type="button" class="btn-eye-toggle" onclick="togglePasswordVisibility('signup-password')" title="Toggle Password Visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <div class="input-group">
              <label class="input-label" for="signup-confirm-password">Confirm Password</label>
              <div class="input-wrapper-pass">
                <input type="password" id="signup-confirm-password" class="input-field" placeholder="Confirm your password" required autocomplete="new-password">
                <button type="button" class="btn-eye-toggle" onclick="togglePasswordVisibility('signup-confirm-password')" title="Toggle Password Visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <div class="options-row" style="margin: 4px 0 16px 0;">
              <label class="checkbox-container" style="display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; color: #4b5563; cursor: pointer; line-height: 1.4;">
                <input type="checkbox" id="signup-terms-check" required style="accent-color: #ef4444; width: 16px; height: 16px; cursor: pointer; margin-top: 2px;">
                <span>I agree to the <a href="legal.html" style="color: #ef4444; font-weight: 600; text-decoration: none;">Terms of Service</a> & <a href="legal.html" style="color: #ef4444; font-weight: 600; text-decoration: none;">Privacy Policy</a></span>
              </label>
            </div>
  
        <button type="submit" class="btn-submit">
          <span>Sign Up</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="divider-custom">or</div>

      <button type="button" class="btn-google-custom" onclick="location.href='feed.html';">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <p class="switch-page-text-custom">
        Already have an account?
        <button type="button" class="switch-page-btn-custom" onclick="location.href='login.html';">Sign In</button>
      </p>
    </div>
  </div>

  <script>
    // Global fetch interceptor for JWT authentication
    (function() {
      const originalFetch = window.fetch;
      window.fetch = function(url, options = {}) {
        options = options || {};
        options.credentials = 'same-origin';
        const token = localStorage.getItem('authToken');
        if (token) {
          options.headers = options.headers || {};
          if (options.headers instanceof Headers) {
            if (!options.headers.has('authorization')) {
              options.headers.append('authorization', 'Bearer ' + token);
            }
          } else {
            options.headers['authorization'] = 'Bearer ' + token;
          }
        }
        return originalFetch(url, options);
      };
    })();

    // Custom Modal Popup Utility (Palette 18)
    function showModalPopup(title, message) {
      let modal = document.getElementById('custom-alert-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'custom-alert-modal';
        modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:var(--font-family);padding:20px;box-sizing:border-box;';
        const content = document.createElement('div');
        content.style.cssText = 'background:#ffffff;border:1px solid #e5e7eb;box-shadow:0 10px 25px rgba(0,0,0,0.1);padding:24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5);width:340px;max-width:100%;text-align:center;';
        const titleEl = document.createElement('h3');
        titleEl.id = 'custom-alert-title';
        titleEl.style.cssText = 'margin:0 0 10px 0;font-size:18px;color:#111827;font-weight:700;';
        const messageEl = document.createElement('p');
        messageEl.id = 'custom-alert-message';
        messageEl.style.cssText = 'margin:0 0 20px 0;font-size:14px;color:#6b7280;line-height:1.5;word-break:break-word;';
        const btn = document.createElement('button');
        btn.textContent = 'OK';
        btn.style.cssText = 'background:#ef4444;color:#ffffff;border:none;padding:10px 28px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;';
        btn.onclick = () => { modal.style.display = 'none'; };
        content.appendChild(titleEl);
        content.appendChild(messageEl);
        content.appendChild(btn);
        modal.appendChild(content);
        document.body.appendChild(modal);
      }
      document.getElementById('custom-alert-title').textContent = title;
      document.getElementById('custom-alert-message').textContent = message;
      modal.style.display = 'flex';
    }

    function togglePasswordVisibility(id) {
      const input = document.getElementById(id);
      if (!input) return;
      input.type = input.type === 'password' ? 'text' : 'password';
    }


    document.getElementById('signup-element-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm-password').value;
      
      if (password !== confirmPassword) {
        showModalPopup('Notice', 'Passwords do not match');
        return;
      }

      if (window.location.protocol === 'file:') {
        localStorage.setItem('currentUser', JSON.stringify({ email, username, subscription: 'pro' }));
        window.location.href = 'feed.html';
        return;
      }
      
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Error during sign up');
        }
        
        if (data.token) {
          localStorage.setItem('authToken', data.token);
        }
        localStorage.setItem('currentUser', JSON.stringify(data.user || data));
        window.location.href = 'feed.html';
      } catch (err) {
        showModalPopup('Sign Up Error', err.message);
      }
    });
  
  </script>
</body>
</html>
