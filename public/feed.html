<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <script src="/auth_helper.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Karu AI - Feed</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;500;700;800;900&family=Playpen+Sans:wght@300;400;700&display=swap');

    /* Load Rubik font */
    @font-face {
      font-family: 'Rubik';
      src: url('Rubik.ttf') format('truetype');
      font-weight: 300 900;
      font-display: swap;
    }

    :root {
      --color-primary: #34E0A1; /* Accent green */
      --color-primary-glow: rgba(52, 224, 161, 0.15);
      --color-bg: #000000; /* Deep black */
      --color-card-bg: rgba(15, 15, 20, 0.85);
      --color-card-border: rgba(255, 255, 255, 0.08);
      --color-primary: #ef4444; /* Palette 18 Crimson Red */
      --color-primary-hover: #dc2626;
      --color-primary-glow: rgba(239, 68, 68, 0.25);
      --color-bg: #111827; /* Deep Slate Gray-900 */
      --color-card-bg: #1f2937; /* Slate Gray-800 */
      --color-card-border: #374151; /* Slate Gray-700 */
      --color-text-main: #FFFFFF;
      --color-text-muted: #8E8E93;
      --color-input-bg: rgba(255, 255, 255, 0.04);
      --color-input-border: rgba(255, 255, 255, 0.1);
      --color-danger: #FF453A;
      --font-family: 'Rubik', system-ui, -apple-system, sans-serif;
      --color-text-muted: #9ca3af; /* Gray-400 */
      --color-input-bg: #1f2937;
      --color-input-border: #374151;
      --color-danger: #ef4444;
      --brand-ruby: #ef4444;
      --font-family: 'Inter', 'Heebo', system-ui, -apple-system, sans-serif;
    }

    /* Basic reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: var(--font-family);
      background-color: #e5e7eb;
      background-image: 
        linear-gradient(45deg, #d1d5db 25%, transparent 25%), 
        linear-gradient(-45deg, #d1d5db 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #d1d5db 75%), 
        linear-gradient(-45deg, transparent 75%, #d1d5db 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      color: var(--color-text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Premium mobile frame */
    /* Premium mobile frame (Palette 18) */
    .mobile-frame {
      width: 100%;
      max-width: 440px;
      height: 100%;
      background: #f9fafb;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #d1d5db;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
      z-index: 10;
      color: #111827;
      padding-top: env(safe-area-inset-top, 24px);
    }

    /* Backgrounds and spotlights */
    .mesh-grid {
      position: absolute;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(52, 224, 161, 0.012) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(52, 224, 161, 0.012) 1px, transparent 1px);
      z-index: 1;
      pointer-events: none;
    }

    .spotlight {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(
        circle, 
        rgba(52, 224, 161, 0.05) 0%, 
        rgba(52, 224, 161, 0.01) 50%, 
        rgba(0, 0, 0, 0) 70%
      );
      filter: blur(40px);
      z-index: 2;
      pointer-events: none;
    }

    .spotlight-1 { top: -100px; right: -100px; }
    .spotlight-2 { bottom: -100px; left: -100px; }

    /* Main page container (SPA) */
    .page-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      animation: fadeIn 0.3s ease forwards;
    }

    .page-container.active {
      display: flex;
    }

    .page-container:not(.active) {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ==========================================================================
       Sign In & Auth pages
       ========================================================================== */
    .auth-page {
      justify-content: center;
      align-items: center;
      padding: 1rem;
      height: 100%;
      overflow: hidden; /* Prevent page scroll since we use viewport fit */
      display: flex;
    }

    .card-wrapper {
      width: 100%;
      background: var(--color-card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--color-card-border);
      border-radius: 24px;
      padding: 1.25rem 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: 90%;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .card-wrapper::-webkit-scrollbar {
      display: none;
    }

    .brand-logo {
      width: 160px;
      height: auto;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 0 8px rgba(52, 224, 161, 0.2));
    }

    .logo-container-floating {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 0.75rem;
      padding-bottom: 0.25rem;
      flex-shrink: 0;
      z-index: 100;
    }

    .logo-floating {
      height: 120px;
      width: auto;
      filter: drop-shadow(0 0 8px rgba(52, 224, 161, 0.25));
    }

    .title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      text-align: center;
      background: linear-gradient(135deg, #FFFFFF 0%, #E0E0E0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-container {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    .form-container.active {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      width: 100%;
      position: relative;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--color-text-muted);
      margin-inline-start: 0.25rem;
    }

    .input-wrapper-pass {
      position: relative;
      width: 100%;
    }

    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--color-input-bg);
      border: 1px solid var(--color-input-border);
      border-radius: 12px;
      color: var(--color-text-main);
      font-family: var(--font-family);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .input-field:focus {
      border-color: var(--color-primary);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 4px var(--color-primary-glow);
    }

    /* Password visibility eye styling */
    .btn-eye-toggle {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s ease, transform 0.1s ease;
    }
    .btn-eye-toggle:hover {
      color: var(--color-primary);
    }
    .btn-eye-toggle:active {
      transform: translateY(-50%) scale(0.9);
    }

    /* Validation helpers */
    .validation-msg {
      font-size: 0.7rem;
      color: var(--color-danger);
      margin-top: 0.2rem;
      margin-inline-start: 0.25rem;
      display: none;
    }

    .pw-requirements {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-top: 0.4rem;
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .requirement-item {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.2s ease;
    }

    .requirement-item.valid {
      color: var(--color-primary);
    }

    .requirement-item svg {
      width: 10px;
      height: 10px;
      stroke: currentColor;
      stroke-width: 3;
      fill: none;
      transition: transform 0.2s ease;
    }

    .requirement-item.valid svg {
      transform: scale(1.2);
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 0.75rem;
      gap: 0.5rem;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: var(--color-text-muted);
      user-select: none;
      transition: color 0.2s ease;
    }
    .checkbox-container:hover {
      color: var(--color-text-main);
    }

    .checkbox-container input {
      display: none;
    }

    .checkmark {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--color-input-border);
      border-radius: 4px;
      position: relative;
      transition: all 0.2s ease;
      display: inline-block;
      flex-shrink: 0;
    }

    .checkbox-container input:checked + .checkmark {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    .checkbox-container input:checked + .checkmark::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      background: var(--color-primary);
      color: #000000;
      border: none;
      border-radius: 12px;
      font-family: var(--font-family);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(52, 224, 161, 0.2);
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 20px rgba(52, 224, 161, 0.35);
      background: #4ef0b1;
    }

    .btn-submit:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 2px 10px rgba(52, 224, 161, 0.15);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.7rem;
      margin: 0.35rem 0;
      width: 100%;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .divider:not(:empty)::before { margin-inline-end: 0.5rem; }
    .divider:not(:empty)::after { margin-inline-start: 0.5rem; }

    .btn-google {
      width: 100%;
      padding: 0.75rem;
      background: transparent;
      color: var(--color-text-main);
      border: 1px solid var(--color-input-border);
      border-radius: 12px;
      font-family: var(--font-family);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-google:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.06);
    }

    .switch-page-text {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      text-align: center;
      margin-top: 0.5rem;
    }

    .switch-page-btn {
      background: none;
      border: none;
      color: var(--color-primary);
      font-family: var(--font-family);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      margin-inline-start: 0.25rem;
      transition: color 0.2s ease;
    }

    .switch-page-btn:hover {
      text-decoration: underline;
      color: #4ef0b1;
    }

    /* ==========================================================================
       Home / Navigation bar
       ========================================================================== */
    .home-view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .mobile-content {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding-bottom: calc(75px + env(safe-area-inset-bottom, 0px));
      scrollbar-width: none;
    }

    .mobile-content::-webkit-scrollbar {
      display: none;
    }

    .sub-screen {
      display: none;
      flex-direction: column;
      width: 100%;
      padding: 0.5rem 1rem 1.25rem 1rem;
      animation: fadeIn 0.25s ease;
    }

    .sub-screen.active {
      display: flex;
    }

    /* Feed Posts */
    .feed-section {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .post-card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      width: auto;
    }

    .post-header {
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .author-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
      padding: 1.5px;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000;
      background: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-primary);
      color: #ffffff;
    }

    .author-info {
      display: flex;
      flex-direction: column;
    }

    .author-name { font-size: 0.8rem; font-weight: 600; }
    .post-time { font-size: 0.65rem; color: var(--color-text-muted); }
    .author-name { font-size: 0.85rem; font-weight: 700; color: #ffffff; }
    .post-time { font-size: 0.65rem; color: #9ca3af; }

    /* Carousel Outer Non-Scrolling Wrapper */
    /* Carousel Outer Non-Scrolling Wrapper (Palette 18: #1f2937) */
    .carousel-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #08080C;
      background: #1f2937;
      overflow: hidden;
      direction: ltr !important;
    }

    /* Carousel - Perfect 1:1 square media frame */
    .carousel-section {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      direction: ltr !important;
    }
    .carousel-section::-webkit-scrollbar {
      display: none;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      width: 100%;
      direction: ltr !important;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      user-select: none;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .slide-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 540px !important;
      height: 540px !important;
      border: none;
      transform-origin: 0 0;
    }

    .slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.85));
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .slide-tag {
      font-size: 0.75rem;
      color: var(--color-primary);
      font-weight: 700;
      margin-bottom: 0.4rem;
      letter-spacing: 1px;
    }

    .slide-title { font-size: 1.4rem; font-weight: 800; color: #FFF; line-height: 1.3; }
    .slide-index {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .carousel-nav-btn {
      display: none !important;
    }

    .carousel-nav-btn:hover { background: var(--color-primary); color: #000; }
    .carousel-nav-btn:active { transform: translateY(-50%) scale(0.9); }
    .btn-prev { left: 0.75rem; }
    .btn-next { right: 0.75rem; }

    /* Carousel Pagination Dots (Palette 18) */
    .carousel-dots {
      position: absolute;
      bottom: 0.85rem;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.4rem;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; cursor: pointer; transition: all 0.2s ease; pointer-events: auto; }
    .dot.active { background: #ef4444 !important; width: 14px; border-radius: 4px; }

    .post-content { padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px solid rgba(255, 255, 255, 0.03); }
    .post-desc { font-size: 0.85rem; line-height: 1.45; color: #E2E8F0; }
    .post-hashtags { font-size: 0.8rem; color: var(--color-primary); font-weight: 500; word-break: break-all; line-height: 1.5; }
    .hashtag-item { display: inline-block; margin-inline-end: 0.5rem; }

    /* Bottom mobile nav bar - 3 modern buttons */
    .bottom-nav {
      position: absolute !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      height: 64px !important;
      background: #ffffff !important;
      border: none !important;
      border-top: 1px solid #e5e7eb !important;
      border-radius: 0 !important;
      z-index: 1000 !important;
      display: flex !important;
      justify-content: space-around !important;
      align-items: center !important;
      padding: 0 16px env(safe-area-inset-bottom, 0px) 16px !important;
      box-sizing: border-box !important;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.04) !important;
    }

    .nav-item {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: #111827 !important;
      cursor: pointer !important;
      background: transparent !important;
      border: none !important;
      padding: 8px !important;
      border-radius: 8px !important;
      width: auto !important;
      min-width: 44px;
      outline: none !important;
      transition: transform 0.2s ease, color 0.2s ease !important;
    }

    .nav-item svg {
      width: 28px !important;
      height: 28px !important;
      stroke-width: 2.2px !important;
      stroke: currentColor !important;
      flex-shrink: 0 !important;
      transition: transform 0.2s ease, stroke 0.2s ease !important;
    }

    .nav-item:hover {
      transform: scale(1.12) !important;
    }

    .nav-item span {
      display: none !important;
    }

    .nav-item.active {
      color: #ef4444 !important;
      background: transparent !important;
    }

    .nav-item.active svg {
      color: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5px !important;
      transform: scale(1.08);
    }

    /* Settings (Settings Screen) */
    .settings-group {
      background: var(--brand-white);
      border: 1px solid var(--color-card-border);
      border-radius: 20px;
      padding: 1rem;
      margin: 1rem;
      box-shadow: 0 8px 24px rgba(38, 47, 49, 0.03);
      box-sizing: border-box;
    }

    .settings-group-title {
      font-family: 'Outfit', var(--font-family);
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      text-align: right;
      padding: 0 0.5rem;
    }

    .setting-item {
      padding: 0.85rem 0.5rem;
      border-bottom: 1px solid rgba(38, 47, 49, 0.06);
    }

    .setting-item:last-child {
      border-bottom: 0;
    }

    .btn-settings-link {
      font-family: var(--font-family);
      font-size: 0.95rem;
      color: var(--brand-slate);
    }

    .btn-upgrade-diamond {
      background: rgba(217, 19, 82, 0.06);
      border: 1px solid rgba(217, 19, 82, 0.15);
      color: var(--brand-ruby);
      font-weight: 700;
      border-radius: 20px;
      padding: 0.6rem 1.2rem;
    }

    .btn-upgrade-diamond:hover {
      background: var(--brand-ruby);
      color: var(--brand-white);
    }

    .btn-settings-danger {
      color: #A60F3D;
      border: 1px solid rgba(217, 19, 82, 0.2);
      background: transparent;
      border-radius: 20px;
      padding: 0.6rem 1.2rem;
      font-weight: 700;
    }

    .btn-settings-danger:hover {
      background: rgba(217, 19, 82, 0.05);
      border-color: var(--brand-ruby);
    }

    /* ModelStyle Style */
    .modal-content {
      background: var(--brand-white);
      border-radius: 24px;
      border: 1px solid var(--color-card-border);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.15);
    }

  <script>
    // Custom Modal Popup Utility
    function showModalPopup(title, message) {
      let modal = document.getElementById('custom-alert-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'custom-alert-modal';
        modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:var(--font-family);padding:20px;box-sizing:border-box;';
        const content = document.createElement('div');
        content.style.cssText = 'background:#1f2937;border:1px solid #374151;padding:24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5);width:340px;max-width:100%;text-align:center;';
        const titleEl = document.createElement('h3');
        titleEl.id = 'custom-alert-title';
        titleEl.style.cssText = 'margin:0 0 10px 0;font-size:18px;color:#ffffff;font-weight:700;';
        const messageEl = document.createElement('p');
        messageEl.id = 'custom-alert-message';
        messageEl.style.cssText = 'margin:0 0 20px 0;font-size:14px;color:#9ca3af;line-height:1.5;word-break:break-word;';
        const btn = document.createElement('button');
        btn.textContent = 'OK';
        btn.style.cssText = 'background:#ef4444;color:#ffffff;border:none;padding:10px 28px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;';
        btn.onclick = () => { modal.style.display = 'none'; };
        content.appendChild(titleEl);
        content.appendChild(messageEl);
        content.appendChild(btn);
        modal.appendChild(content);
        document.body.appendChild(modal);
      }
      document.getElementById('custom-alert-title').textContent = title;
      document.getElementById('custom-alert-message').textContent = message;
      modal.style.display = 'flex';
    }

    
    function toggleSearchHeader(e) {
      if (e) e.stopPropagation();
      const searchRow = document.getElementById("search-filter-row");
      const searchBtn = document.getElementById("btn-toggle-search");
      if (!searchRow) return;
      const isHidden = searchRow.style.display === "none" || !searchRow.style.display;
      if (isHidden) {
        searchRow.style.display = "flex";
        if (searchBtn) searchBtn.style.color = "#ef4444";
        const input = document.getElementById("search-input");
        if (input) input.focus();
      } else {
        searchRow.style.display = "none";
        if (searchBtn) searchBtn.style.color = "#111827";
        const sortMenu = document.getElementById("sort-dropdown-menu");
        if (sortMenu) sortMenu.style.display = "none";
      }
    }

    function toggleNotificationsDropdown(e) {
      if (e) e.stopPropagation();
      const dropdown = document.getElementById('notifications-dropdown');
      if (!dropdown) return;
      dropdown.style.display = dropdown.style.display === 'none' || !dropdown.style.display ? 'block' : 'none';
      const userMenu = document.getElementById('user-mini-menu');
      if (userMenu) userMenu.style.display = 'none';
      const sortMenu = document.getElementById('sort-dropdown-menu');
      if (sortMenu) sortMenu.style.display = 'none';
    }

    function toggleUserMiniMenu(btn, e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('user-mini-menu');
      if (!menu) return;
      const isHidden = menu.style.display === 'none' || !menu.style.display;
      
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => item.classList.remove('active'));

      if (isHidden) {
        menu.style.display = 'block';
        if (btn) btn.classList.add('active');
        const dropdown = document.getElementById('notifications-dropdown');
        if (dropdown) dropdown.style.display = 'none';
      } else {
        menu.style.display = 'none';
        const feedBtn = document.getElementById('btn-tab-feed');
        if (feedBtn) feedBtn.classList.add('active');
      }
    }

    function clearNotifications() {
      const list = document.getElementById('notifications-list');
      if (list) {
        list.innerHTML = '<div style="text-align: center; padding: 20px; color: #9ca3af; font-size: 11px;">No new notifications</div>';
      }
    }

    window.addEventListener('click', (event) => {
      const dropdown = document.getElementById('notifications-dropdown');
      const userMenu = document.getElementById('user-mini-menu');
      const sortMenu = document.getElementById('sort-dropdown-menu');
      
      const notifBtn = document.getElementById('btn-tab-notifications');
      const profileBtn = document.getElementById('btn-tab-settings');
      const filterBtn = document.querySelector('.btn-filter-custom');

      if (dropdown && dropdown.style.display === 'block') {
        if (!event.target.closest('#btn-tab-notifications') && !event.target.closest('#notifications-dropdown')) {
          dropdown.style.display = 'none';
        }
      }
      if (userMenu && userMenu.style.display === 'block') {
        if (!event.target.closest('#btn-tab-settings') && !event.target.closest('#user-mini-menu')) {
          userMenu.style.display = 'none';
          const feedBtn = document.getElementById('btn-tab-feed');
          if (feedBtn) feedBtn.classList.add('active');
          if (profileBtn) profileBtn.classList.remove('active');
        }
      }
      if (sortMenu && sortMenu.style.display === 'block') {
        if (!event.target.closest('.btn-filter-custom') && !event.target.closest('#sort-dropdown-menu')) {
          sortMenu.style.display = 'none';
        }
      }
    });

    function toggleSortMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('sort-dropdown-menu');
      if (menu) {
        menu.style.display = menu.style.display === 'none' || !menu.style.display ? 'block' : 'none';
      }
    }

    let currentFeedTab = 'yours';

    function switchFeedTab(tab) {
      currentFeedTab = tab;
      const yoursTab = document.getElementById('feed-tab-yours');
      const communityTab = document.getElementById('feed-tab-community');
      const yoursInd = document.getElementById('feed-tab-yours-indicator');
      const communityInd = document.getElementById('feed-tab-community-indicator');
      
      const yoursFeed = document.getElementById('feed-posts-container');
      const communityFeed = document.getElementById('community-posts-feed-container');
      const viralFeed = document.getElementById('viral-posts-feed-container');

      if (yoursTab && communityTab) {
        if (tab === 'yours') {
          yoursTab.style.color = '#111827';
          yoursTab.style.fontWeight = '700';
          if (yoursInd) yoursInd.style.background = '#111827';
          communityTab.style.color = '#9ca3af';
          communityTab.style.fontWeight = '500';
          if (communityInd) communityInd.style.background = 'transparent';
        } else {
          communityTab.style.color = '#111827';
          communityTab.style.fontWeight = '700';
          if (communityInd) communityInd.style.background = '#111827';
          yoursTab.style.color = '#9ca3af';
          yoursTab.style.fontWeight = '500';
          if (yoursInd) yoursInd.style.background = 'transparent';
        }
      }

      if (yoursFeed) yoursFeed.style.display = 'none';
      if (communityFeed) communityFeed.style.display = 'none';
      if (viralFeed) viralFeed.style.display = 'none';

      if (tab === 'yours') {
        if (yoursFeed) yoursFeed.style.display = 'flex';
      } else if (tab === 'community') {
        if (communityFeed) communityFeed.style.display = 'flex';
        if (viralFeed) viralFeed.style.display = 'flex';
        fetchCommunityPosts();
      }
    }

    let allPosts = [];
    let communityPosts = [];
    let currentSortOrder = 'latest';
    let currentSearchQuery = '';

    function setSortOrder(order) {
      currentSortOrder = order;
      const menu = document.getElementById('sort-dropdown-menu');
      if (menu) menu.style.display = 'none';
      renderFilteredAndSortedPosts();
    }

    function handleSearchInput() {
      const input = document.getElementById('search-input');
      currentSearchQuery = input ? input.value.toLowerCase().trim() : '';
      renderFilteredAndSortedPosts();
    }

    function renderFilteredAndSortedPosts() {
      if (currentFeedTab === 'community') {
        let cPosts = [...communityPosts];
        if (currentSearchQuery) {
          cPosts = cPosts.filter(post => {
            const title = (post.title || '').toLowerCase();
            const desc = (post.description || '').toLowerCase();
            const tags = (post.hashtags || '').toLowerCase();
            const author = (post.username || '').toLowerCase();
            return title.includes(currentSearchQuery) || desc.includes(currentSearchQuery) || tags.includes(currentSearchQuery) || author.includes(currentSearchQuery);
          });
        }
        if (currentSortOrder === 'latest') {
          cPosts.sort((a, b) => new Date(b.created_at || b.date) - new Date(a.created_at || a.date));
        } else if (currentSortOrder === 'earliest') {
          cPosts.sort((a, b) => new Date(a.created_at || a.date) - new Date(b.created_at || b.date));
        } else if (currentSortOrder === 'tokens') {
          cPosts.sort((a, b) => {
            const tokensA = (a.tokens?.prompt || 0) + (a.tokens?.save || 0) + (a.tokens?.autopost || 0) || (a.tokens_cost || 0);
            const tokensB = (b.tokens?.prompt || 0) + (b.tokens?.save || 0) + (b.tokens?.autopost || 0) || (b.tokens_cost || 0);
            return tokensB - tokensA;
          });
        }
        renderCommunityPostsList(cPosts);
        setTimeout(adjustIframeScale, 50);
        return;
      }

      let posts = [...allPosts];
      
      if (currentSearchQuery) {
        posts = posts.filter(post => {
          const title = (post.title || '').toLowerCase();
          const desc = (post.description || '').toLowerCase();
          const tags = (post.hashtags || '').toLowerCase();
          return title.includes(currentSearchQuery) || desc.includes(currentSearchQuery) || tags.includes(currentSearchQuery);
        });
      }
      
      if (currentSortOrder === 'latest') {
        posts.sort((a, b) => new Date(b.created_at || b.date) - new Date(a.created_at || a.date));
      } else if (currentSortOrder === 'earliest') {
        posts.sort((a, b) => new Date(a.created_at || a.date) - new Date(b.created_at || b.date));
      } else if (currentSortOrder === 'tokens') {
        posts.sort((a, b) => {
          const tokensA = (a.tokens?.prompt || 0) + (a.tokens?.save || 0) + (a.tokens?.autopost || 0) || (a.tokens_cost || 0);
          const tokensB = (b.tokens?.prompt || 0) + (b.tokens?.save || 0) + (b.tokens?.autopost || 0) || (b.tokens_cost || 0);
          return tokensB - tokensA;
        });
      }
      
      renderFeedPosts(posts);
      setTimeout(adjustIframeScale, 50);
    }

    function duplicateViralPost(prompt) {
      localStorage.setItem('prefilledPrompt', prompt);
      location.href = 'chat.html';
    }

    function handleCarouselScroll(event) {
      const carousel = event.currentTarget;
      const slideWidth = carousel.clientWidth;
      if (slideWidth <= 0) return;
      const activeIndex = Math.round(carousel.scrollLeft / slideWidth);
      const currentSlide = parseInt(carousel.getAttribute('data-current-slide') || '0');
      if (activeIndex !== currentSlide) {
        carousel.setAttribute('data-current-slide', activeIndex);
        updateCarouselUI(carousel);
      }
    }

    function jumpToSlide(dot, index) {
      const wrapper = dot.closest('.carousel-wrapper') || dot.closest('.post-card') || dot.closest('.carousel-section');
      const carousel = wrapper.querySelector('.carousel-section') || wrapper;
      carousel.setAttribute('data-current-slide', index);
      const slideWidth = carousel.clientWidth;
      carousel.scrollTo({
        left: index * slideWidth,
        behavior: 'smooth'
      });
      updateCarouselUI(carousel);
    }

    function goToSlide(dot, index) {
      jumpToSlide(dot, index);
    }

    function updateCarouselUI(carousel) {
      const currentSlide = parseInt(carousel.getAttribute('data-current-slide') || '0');
      const wrapper = carousel.closest('.carousel-wrapper') || carousel.closest('.post-card') || carousel;
      const dots = wrapper.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        if (idx === currentSlide) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    async function fetchCommunityPosts() {
      const container = document.getElementById('community-posts-feed-container');
      if (!container) return;
      container.innerHTML = `<div style="text-align: center; padding: 40px; color: #9ca3af;">Loading Community Feed...</div>`;
      try {
        const res = await fetch('/api/posts/community');
        if (!res.ok) throw new Error('Failed to fetch community posts');
        const posts = await res.json();
        communityPosts = posts || [];
        renderFilteredAndSortedPosts();
      } catch (e) {
        console.error(e);
        container.innerHTML = `<div style="text-align: center; padding: 40px; color: #9ca3af;">No community posts available right now.</div>`;
      }
    }

    function renderCommunityPostsList(posts) {
      const container = document.getElementById('community-posts-feed-container');
      if (!container) return;
      if (!posts || posts.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #9ca3af;">
            <p>No community posts shared yet.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = posts.map(post => {
        const slides = post.slides || [];
        const totalTokens = post.tokens 
          ? ((post.tokens.prompt || 0) + (post.tokens.save || 0) + (post.tokens.autopost || 0))
          : (post.tokens_cost || 2272);
        
        return `

    async function initFeed() {
      try {
        if (window.location.protocol === 'file:') {
          console.warn('Running via file:// protocol. Loading demo posts for local viewing.');
          loadDemoPosts();
          return;
        }

        const authRes = await fetch('/api/auth/me');
        if (!authRes.ok) {
          console.warn('Auth check failed with status: ' + authRes.status);
          if (authRes.status === 401) {
            window.location.href = 'login.html';
            return;
          }
          loadDemoPosts();
          return;
        }
        
        const user = await authRes.json();
        localStorage.setItem('currentUser', JSON.stringify(user));

        if (user.role === 'admin') {
          const adminBtn = document.getElementById('admin-nav-btn');
          if (adminBtn) adminBtn.style.display = 'flex';
        }

        // Fetch user posts
        const postsRes = await fetch('/api/posts/my');
        if (!postsRes.ok) {
          throw new Error('Failed to fetch posts: Status ' + postsRes.status);
        }
        allPosts = await postsRes.json() || [];
        renderFilteredAndSortedPosts();

      } catch (err) {
        console.error('Feed initialization error:', err);
        allPosts = [];
        renderFilteredAndSortedPosts();
      }
    }

    function adjustIframeScale() {
      const slides = document.querySelectorAll('.carousel-slide');
      slides.forEach(slide => {
        const iframe = slide.querySelector('.slide-iframe');
        if (iframe) {
          const containerWidth = slide.clientWidth;
          if (containerWidth > 0) {
            const scale = containerWidth / 540;
            iframe.style.transform = `scale(${scale})`;
          }
        }
      });
    }

    window.addEventListener('resize', adjustIframeScale);
    document.addEventListener('DOMContentLoaded', () => {
      initFeed();
      renderViralSuggestions();
      setTimeout(adjustIframeScale, 500);
    });

    async function downloadCarousel(postId) {
      const btn = document.querySelector(`#post-${postId} .btn-download-carousel`);
      const originalHTML = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<svg class="spinner" width="16" height="16" viewBox="0 0 50 50" style="animation: rotate 2s linear infinite; color: #ef4444;"><circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" style="stroke-dasharray: 1, 150; stroke-dashoffset: 0; animation: dash 1.5s ease-in-out infinite;"></circle></svg>`;
      }
      
      try {
        let post = allPosts.find(p => p.id === postId);
        if (!post || !post.slides) {
          const res = await fetch(`/api/posts/${postId}/chat`);
          if (res.ok) {
            const data = await res.json();
            post = data.carousel;
          }
        }
        
        if (!post || !post.slides) throw new Error('Post or slides not found');
        
        const tempIframe = document.createElement('iframe');
        tempIframe.style.width = '540px';
        tempIframe.style.height = '540px';
        tempIframe.style.position = 'fixed';
        tempIframe.style.top = '-9999px';
        tempIframe.style.left = '-9999px';
        tempIframe.style.border = 'none';
        document.body.appendChild(tempIframe);
        
        const slides = post.slides;
        for (let i = 0; i < slides.length; i++) {
          const slide = slides[i];
          const iframeDoc = tempIframe.contentWindow.document;
          iframeDoc.open();
          iframeDoc.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <style>
                html, body {
                  margin: 0;
                  padding: 0;
                  width: 540px;
                  height: 540px;
                  overflow: hidden;
                  background: ${sanitizeBackgroundStyle(slide.background_style)};
                }
              </style>
            </head>
            <body>
              ${slide.html_content}
            </body>
            </html>
          `);
          iframeDoc.close();
          
          await Promise.all([
            iframeDoc.fonts ? iframeDoc.fonts.ready : Promise.resolve(),
            new Promise(resolve => {
              const images = Array.from(iframeDoc.images);
              if (images.length === 0) return resolve();
              let loaded = 0;
              images.forEach(img => {
                if (img.complete) {
                  loaded++;
                  if (loaded === images.length) resolve();
                } else {
                  img.onload = img.onerror = () => {
                    loaded++;
                    if (loaded === images.length) resolve();
                  };
                }
              });
            })
          ]);
          await new Promise(resolve => setTimeout(resolve, 200));
          
          const canvas = await html2canvas(iframeDoc.body, {
            width: 540,
            height: 540,
            scale: 2,
            useCORS: true,
            allowTaint: true,
            logging: false
          });
          
          const link = document.createElement('a');
          link.download = `${(post.title || 'carousel').replace(/[^a-zA-Z0-9-]+/g, '_')}_slide_${i + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }
        
        document.body.removeChild(tempIframe);
        showModalPopup('Download Complete', 'All slides downloaded successfully!');
      } catch (err) {
        console.error('Download error:', err);
        showModalPopup('Download Error', err.message || 'Failed to download slides');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHTML;
        }
      }
    }

    async function shareToInstagramNative(postId) {
      try {
        let post = allPosts.find(p => p.id === postId);
        if (!post || !post.slides) {
          const res = await fetch(`/api/posts/${postId}/chat`);
          if (res.ok) {

          }
        }

        if (!post || !post.slides || !post.slides.length) throw new Error('Post or slides not found');

        const fullCaption = `${post.description || ''}\n\n${post.hashtags || ''}`.trim();
        const slidesImages = [];

        const tempIframe = document.createElement('iframe');
        tempIframe.style.width = '540px';
        tempIframe.style.height = '540px';
        tempIframe.style.position = 'fixed';
        tempIframe.style.top = '-9999px';
        tempIframe.style.left = '-9999px';
        tempIframe.style.border = 'none';
        document.body.appendChild(tempIframe);

        for (let i = 0; i < post.slides.length; i++) {
          const slide = post.slides[i];
          const iframeDoc = tempIframe.contentWindow.document;
          iframeDoc.open();
          iframeDoc.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <style>
                html, body {
                  margin: 0;
                  padding: 0;
                  width: 540px;
                  height: 540px;
                  overflow: hidden;
                  background: ${sanitizeBackgroundStyle(slide.background_style)};
                }
              </style>
            </head>
            <body>
              ${slide.html_content}
            </body>
            </html>
          `);
          iframeDoc.close();

          await Promise.all([
            iframeDoc.fonts ? iframeDoc.fonts.ready : Promise.resolve(),
            new Promise(resolve => {
              const images = Array.from(iframeDoc.images);
              if (images.length === 0) return resolve();
              let loaded = 0;
              images.forEach(img => {
                if (img.complete) {
                  loaded++;
                  if (loaded === images.length) resolve();
                } else {
                  img.onload = img.onerror = () => {
                    loaded++;
                    if (loaded === images.length) resolve();
                  };
                }
              });
            })
          ]);
          await new Promise(resolve => setTimeout(resolve, 200));

          const canvas = await html2canvas(iframeDoc.body, {
            width: 540,
            height: 540,
            scale: 2,
            useCORS: true,
            allowTaint: true,
            logging: false
          });

          slidesImages.push(canvas.toDataURL('image/png'));
        }

        document.body.removeChild(tempIframe);

        const apiRes = await fetch('/api/social/publish-instagram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            postId: postId,
            slidesImages: slidesImages,
            caption: fullCaption
          })
        });

        const apiData = await apiRes.json();

        if (!apiRes.ok || !apiData.success) {
          throw new Error(apiData.error || 'Error publishing to Instagram');
        }

        showModalPopup(
          'Instagram Published!',
          'Carousel published successfully to your Instagram account!'
        );

      } catch (err) {
        console.error('Instagram publish error:', err);
        showModalPopup('Instagram Publish', err.message || 'Could not publish to Instagram');
      }
    }

    async function deleteCarousel(postId) {
      if (!confirm('Are you sure you want to delete this post permanently?')) return;
      
      try {
        const res = await fetch(`/api/posts/${postId}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error deleting post');
        
        const card = document.getElementById(`post-${postId}`);
        if (card) {
          card.remove();
        }
        
        if (typeof initFeed === 'function') {
          initFeed();
        }
      } catch (err) {
        console.error('Delete carousel error:', err);
        showModalPopup('Delete Error', err.message);
      }
    }

    // Carousel mouse drag
    let isDraggingCarousel = false;
    let dragStartX = 0;
    let dragScrollLeft = 0;
    let dragTargetCarousel = null;

    document.addEventListener('mousedown', (e) => {
      const carousel = e.target.closest('.carousel-section');
      if (!carousel) return;
      isDraggingCarousel = true;
      dragTargetCarousel = carousel;
      dragStartX = e.pageX - carousel.offsetLeft;
      dragScrollLeft = carousel.scrollLeft;
      carousel.style.scrollSnapType = 'none';
      carousel.style.scrollBehavior = 'auto';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDraggingCarousel || !dragTargetCarousel) return;
      e.preventDefault();
      const x = e.pageX - dragTargetCarousel.offsetLeft;
      const walk = (x - dragStartX) * 1.5;
      dragTargetCarousel.scrollLeft = dragScrollLeft - walk;
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDraggingCarousel || !dragTargetCarousel) return;
      isDraggingCarousel = false;
      
      const carousel = dragTargetCarousel;
      dragTargetCarousel = null;
      
      carousel.style.scrollSnapType = 'x mandatory';
      carousel.style.scrollBehavior = 'smooth';
      
      const slideWidth = carousel.clientWidth;
      if (slideWidth > 0) {
        const activeIndex = Math.round(carousel.scrollLeft / slideWidth);
        carousel.scrollTo({
          left: activeIndex * slideWidth,
          behavior: 'smooth'
        });
      }
    });
  </script>
